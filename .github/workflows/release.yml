name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Tests
        run: npm test
      - name: Tag matches the version in preset.config.json
        run: |
          v=$(node bin/cli.mjs release-version --version-file preset.config.json)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match version v$v" >&2; exit 1; fi
      - name: Release notes from CHANGELOG
        run: node bin/cli.mjs release-notes --version "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

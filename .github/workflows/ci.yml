name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Tests
        run: npm test
      - name: Validate structure, tickets, ADRs and map paths
        run: node bin/cli.mjs validate
      - name: Adapters are up to date
        run: node bin/cli.mjs sync --check

  tickets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Every commit references a ticket
        run: node bin/cli.mjs check-commits --range "origin/${{ github.base_ref }}..HEAD"

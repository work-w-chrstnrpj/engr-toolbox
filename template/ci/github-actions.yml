# Copy to .github/workflows/engr-toolbox.yml to enforce the workflow in CI.
name: AI structure

on:
  pull_request:

jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Tickets, ADRs and map paths are valid
        run: node .ai/cli/bin/cli.mjs validate
      - name: Adapters are up to date
        run: node .ai/cli/bin/cli.mjs sync --check
      - name: Every commit references a ticket
        run: node .ai/cli/bin/cli.mjs check-commits --range "origin/${{ github.base_ref }}..HEAD"
      - name: Report drift for reviewers
        run: node .ai/cli/bin/cli.mjs drift --since "origin/${{ github.base_ref }}" || true
